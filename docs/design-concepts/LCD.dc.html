<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backlit LCD workstation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&amp;family=Pixelify+Sans:wght@500;700&amp;family=Silkscreen&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#9d988e}
a{color:#3b3a36}a:hover{color:#111}
</style>
</helmet>
<div style="width: 1400px; height: 620px; box-sizing: border-box; position: relative; overflow: hidden; background: linear-gradient(180deg, #c9c4b8 0%, #bdb8ac 55%, #b3aea2 100%); font-family: 'Archivo Narrow', sans-serif; color: #34332f; display: flex; flex-direction: column;">

<div style="height: 30px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid #a7a296; box-shadow: 0 1px 0 #d8d3c8;">
<span style="font-weight: 700; font-size: 16px; letter-spacing: 1px; color: #2a2926; font-style: italic;">PMV-61</span>
<span style="font-weight: 600; font-size: 11px; letter-spacing: 2px; color: #5a5852;">MUSIC HARMONY WORKSTATION</span>
<span style="font-weight: 700; font-size: 11px; letter-spacing: 2px; color: #4a4843; margin-left: 10px;">VIEW</span>
<div style="flex-grow: 1;"></div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #4a4843;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #5ee36a; box-shadow: 0 0 5px #5ee36a;"></span>MIDI IN</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #4a4843;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #5ee36a; box-shadow: 0 0 5px #5ee36a;"></span>ASIO OUT</div>
<div style="display: flex; gap: 20px; margin-left: 18px; font-size: 13px; color: #5a5852;"><span>—</span><span>□</span><span>×</span></div>
</div>

<div style="display: flex; gap: 16px; padding: 10px 20px 0 20px; flex: none;">
<div style="width: 1120px; box-sizing: border-box; padding: 10px; border-radius: 6px; background: linear-gradient(180deg, #3a3a3c, #2a2a2c); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 1px 0 #e1dcd1;">
<div style="height: 248px; box-sizing: border-box; border-radius: 2px; position: relative; overflow: hidden; background: repeating-linear-gradient(0deg, rgba(20,30,10,0.05) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(20,30,10,0.05) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 40%, {{lcdHi}} 0%, {{lcdLo}} 100%); box-shadow: inset 0 3px 8px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.4); color: #1f2a12; display: flex; flex-direction: column; text-shadow: 1px 1px 0 rgba(31,42,18,0.16);">

<div style="height: 20px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: rgba(31,42,18,0.88); color: {{lcdHi}}; font-family: Silkscreen, monospace; font-size: 11px; text-shadow: none;">
<span>PLAY ▸ HARMONY</span>
<span>KEY:C MAJOR   ♩=090   4/4   SPD:100%</span>
</div>

<div style="flex-grow: 1; display: flex; align-items: center; padding: 0 10px; gap: 10px; min-height: 0;">
<svg width="160" height="190" viewBox="0 0 160 190" aria-hidden="true">
<g style="stroke: rgba(31,42,18,0.75); stroke-width: 1.5;">
<line x1="8" y1="30" x2="156" y2="30"></line><line x1="8" y1="42" x2="156" y2="42"></line><line x1="8" y1="54" x2="156" y2="54"></line><line x1="8" y1="66" x2="156" y2="66"></line><line x1="8" y1="78" x2="156" y2="78"></line>
<line x1="8" y1="116" x2="156" y2="116"></line><line x1="8" y1="128" x2="156" y2="128"></line><line x1="8" y1="140" x2="156" y2="140"></line><line x1="8" y1="152" x2="156" y2="152"></line><line x1="8" y1="164" x2="156" y2="164"></line>
<line x1="8" y1="30" x2="8" y2="164"></line>
</g>
<text x="14" y="72" style="fill: #1f2a12; font: 50px 'Segoe UI Symbol', 'Apple Symbols', serif;">𝄞</text>
<text x="14" y="148" style="fill: #1f2a12; font: 38px 'Segoe UI Symbol', 'Apple Symbols', serif;">𝄢</text>
<g style="fill: #1f2a12;">
<rect x="110" y="80" width="13" height="9"></rect>
<rect x="110" y="124" width="13" height="9"></rect>
<rect x="124" y="118" width="13" height="9"></rect>
<rect x="110" y="148" width="13" height="9"></rect>
</g>
</svg>

<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;">
<div style="font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 96px; line-height: 0.95; letter-spacing: 2px;">G7/B</div>
<div style="font-family: VT323, monospace; font-size: 26px; display: flex; gap: 10px; align-items: baseline;"><span style="background: #1f2a12; color: {{lcdHi}}; padding: 0 6px; text-shadow: none;">V65</span><span>1st inversion · drop 2</span></div>
<div style="display: flex; gap: 20px; margin-top: 2px;">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; font-family: VT323, monospace; line-height: 1;"><span style="font-size: 28px;">{{n.note}}</span><span style="font-size: 20px; opacity: 0.7;">{{n.iv}}</span></div>
</sc-for>
</div>
</div>

<svg width="200" height="200" viewBox="0 0 240 240" aria-hidden="true">
<defs>
<pattern id="lcdhatch" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" style="fill: rgba(31,42,18,0.55);"></rect><rect x="2" y="2" width="2" height="2" style="fill: rgba(31,42,18,0.55);"></rect></pattern>
</defs>
<sc-for list="{{maj}}" as="s" hint-placeholder-count="12">
<path d="{{s.d}}" style="{{s.ps}}"></path>
<text x="{{s.lx}}" y="{{s.ly}}" style="{{s.ts}}">{{s.label}}</text>
</sc-for>
<sc-for list="{{min}}" as="s" hint-placeholder-count="12">
<path d="{{s.d}}" style="{{s.ps}}"></path>
<text x="{{s.lx}}" y="{{s.ly}}" style="{{s.ts}}">{{s.label}}</text>
</sc-for>
<text x="120" y="122" style="fill: #1f2a12; font: 30px VT323, monospace; text-anchor: middle; dominant-baseline: central;">KEY C</text>
</svg>

<div style="width: 2px; align-self: stretch; margin: 10px 0; background: rgba(31,42,18,0.6);"></div>

<div style="width: 220px; align-self: stretch; padding: 8px 0; display: flex; flex-direction: column; gap: 2px; font-family: VT323, monospace;">
<div style="display: flex; justify-content: space-between; font-family: Silkscreen, monospace; font-size: 11px;"><span>PROGRESSION</span><span>4/8</span></div>
<sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
<div style="{{s.style}}"><span style="width: 18px; opacity: 0.7;">{{s.idx}}</span><span style="width: 44px; font-size: 20px;">{{s.name}}</span><span style="width: 30px;">{{s.num}}</span><span style="font-size: 16px; opacity: 0.75;">{{s.notes}}</span></div>
</sc-for>
<div style="margin-top: auto; font-family: Silkscreen, monospace; font-size: 10px;">NEXT ▸ I:C  vi:Am  IV:F</div>
</div>
</div>

<div style="height: 26px; flex: none; display: flex; gap: 6px; padding: 0 14px 4px 14px;">
<sc-for list="{{strip}}" as="t" hint-placeholder-count="8">
<div style="{{t.style}}"><span>{{t.num}}</span><span style="opacity: 0.8;">{{t.name}}</span></div>
</sc-for>
</div>
</div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px;">
<div style="display: flex; justify-content: space-between; align-items: flex-start;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 12px;">
<sc-for list="{{side}}" as="b" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: #3e3d39;"><span style="{{b.led}}"></span>{{b.lab}}</div>
<div style="{{b.key}}"></div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<div style="width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4b4b4e, #232325 70%); box-shadow: 0 4px 8px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 0 4px #a9a498; position: relative;">
<div style="position: absolute; left: 62px; top: 20px; width: 12px; height: 12px; border-radius: 50%; background: #1a1a1b; box-shadow: inset 0 2px 3px rgba(0,0,0,0.8);"></div>
</div>
<span style="font-size: 10px; font-weight: 700; letter-spacing: 2px; color: #3e3d39;">VALUE</span>
</div>
</div>
<div style="display: flex; gap: 8px;">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: center;"><span style="font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: #3e3d39;">DEC</span><div style="width: 100%; height: 22px; border-radius: 3px; background: linear-gradient(180deg,#5a5a5d,#3a3a3c); box-shadow: 0 2px 0 #222, inset 0 1px 0 rgba(255,255,255,0.15);"></div></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: center;"><span style="font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: #3e3d39;">INC</span><div style="width: 100%; height: 22px; border-radius: 3px; background: linear-gradient(180deg,#5a5a5d,#3a3a3c); box-shadow: 0 2px 0 #222, inset 0 1px 0 rgba(255,255,255,0.15);"></div></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: center;"><span style="font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: #3e3d39;">SAVE</span><div style="width: 100%; height: 22px; border-radius: 3px; background: linear-gradient(180deg,#f0a43a,#d6852a); box-shadow: 0 2px 0 #8a5216, inset 0 1px 0 rgba(255,255,255,0.3);"></div></div>
</div>
</div>
</div>

<div style="display: flex; gap: 6px; padding: 8px 0 0 44px; flex: none; height: 30px; box-sizing: border-box;">
<sc-for list="{{softkeys}}" as="k" hint-placeholder-count="8">
<div style="{{k.style}}"></div>
</sc-for>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; padding: 8px 20px 0 20px; min-height: 0;">
<div style="position: relative; height: 14px; flex: none;">
<sc-for list="{{leds}}" as="l" hint-placeholder-count="61">
<span style="{{l.style}}"></span>
</sc-for>
</div>
<div style="height: 6px; flex: none; background: linear-gradient(180deg, #6b1f22, #4a1416); margin-top: 2px;"></div>
<div style="position: relative; flex-grow: 1; background: #1a1816;">
<sc-for list="{{whites}}" as="k" hint-placeholder-count="36">
<div style="{{k.style}}"><span style="{{k.ls}}">{{k.label}}</span></div>
</sc-for>
<sc-for list="{{blacks}}" as="k" hint-placeholder-count="25">
<div style="{{k.style}}"></div>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"backlight":{"editor":"enum","default":"yellow-green","options":["yellow-green","amber","ice blue"]},"$preview":{"width":1400,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const BL = { 'yellow-green': ['#c3cf74', '#9fae55'], 'amber': ['#f2b75a', '#d38f33'], 'ice blue': ['#a9d6e8', '#7fb3cc'] };
    const [hi, lo] = BL[this.props.backlight ?? 'yellow-green'] || BL['yellow-green'];
    const INK = '#1f2a12';
    const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
    const WHITE = [0, 2, 4, 5, 7, 9, 11];
    const held = [47, 53, 55, 62];
    const W = 1360, H = 250, ww = W / 36, bw = ww * 0.58, bh = H * 0.62;
    const whites = [], blacks = [], leds = [];
    let wi = 0;
    const led = (x, c) => 'position:absolute;top:4px;left:' + (x - 3).toFixed(1) + 'px;width:6px;height:6px;border-radius:50%;' + (c ? 'background:' + c + ';box-shadow:0 0 6px ' + c + ',0 0 2px ' + c + ';' : 'background:#7d786d;box-shadow:inset 0 1px 1px rgba(0,0,0,0.5);');
    for (let m = 36; m <= 96; m++) {
      const pc = m % 12, oct = Math.floor(m / 12) - 1, h = held.includes(m), t = pc === 0;
      const lc = h ? '#4aa8ff' : (t ? '#ffb238' : null);
      if (WHITE.includes(pc)) {
        const bg = h ? 'linear-gradient(180deg,#d9d2c3 0%,#e4ddcf 70%,#cfc7b6 100%)' : 'linear-gradient(180deg,#efeadf 0%,#fbf8f0 18%,#f6f1e7 85%,#e5dfd2 100%)';
        whites.push({
          label: t ? 'C' + oct : '',
          style: 'position:absolute;top:0;left:' + (wi * ww).toFixed(1) + 'px;width:' + (ww - 1).toFixed(1) + 'px;height:' + (h ? H - 3 : H) + 'px;background:' + bg + ';border-radius:0 0 4px 4px;box-shadow:' + (h ? 'inset 0 3px 4px rgba(0,0,0,0.25)' : 'inset 0 -5px 0 #ddd6c8, 0 2px 2px rgba(0,0,0,0.35)') + ';',
          ls: 'position:absolute;left:0;right:0;bottom:12px;text-align:center;font:700 10px "Archivo Narrow",sans-serif;color:#8a8475;'
        });
        leds.push({ style: led(wi * ww + ww / 2, lc) });
        wi++;
      } else {
        const bg = h ? 'linear-gradient(180deg,#0b0a09,#1c1a18 90%,#2a2724)' : 'linear-gradient(180deg,#121110 0%,#2b2825 8%,#1b1917 80%,#3a3632 92%,#141312 100%)';
        blacks.push({ style: 'position:absolute;top:0;left:' + (wi * ww - bw / 2).toFixed(1) + 'px;width:' + bw.toFixed(1) + 'px;height:' + (h ? bh - 4 : bh).toFixed(0) + 'px;background:' + bg + ';border-radius:0 0 3px 3px;box-shadow:2px 3px 4px rgba(0,0,0,0.55);' });
        leds.push({ style: led(wi * ww, lc) });
      }
    }
    const pt = (r, a) => (120 + r * Math.cos(a * Math.PI / 180)).toFixed(2) + ' ' + (120 + r * Math.sin(a * Math.PI / 180)).toFixed(2);
    const sector = (r1, r2, i) => { const a0 = -105 + i * 30 + 1.5, a1 = -75 + i * 30 - 1.5; return 'M ' + pt(r2, a0) + ' A ' + r2 + ' ' + r2 + ' 0 0 1 ' + pt(r2, a1) + ' L ' + pt(r1, a1) + ' A ' + r1 + ' ' + r1 + ' 0 0 0 ' + pt(r1, a0) + ' Z'; };
    const lab = (r, i) => { const a = (-90 + i * 30) * Math.PI / 180; return { lx: (120 + r * Math.cos(a)).toFixed(1), ly: (120 + r * Math.sin(a)).toFixed(1) }; };
    const MAJ = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'D♭', 'A♭', 'E♭', 'B♭', 'F'];
    const MIN = ['a', 'e', 'b', 'f♯', 'c♯', 'g♯', 'e♭', 'b♭', 'f', 'c', 'g', 'd'];
    const maj = MAJ.map((label, i) => {
      const sel = i === 0, rel = i === 1 || i === 11, root = i === 1;
      let fill = 'transparent', tc = INK, sw = 1.5;
      if (rel) fill = 'url(#lcdhatch)';
      if (sel) { fill = INK; tc = hi; }
      if (root) sw = 4;
      return Object.assign({ label, d: sector(78, 116, i), ps: 'fill:' + fill + ';stroke:' + INK + ';stroke-width:' + sw + ';', ts: 'fill:' + tc + ';font:26px VT323,monospace;text-anchor:middle;dominant-baseline:central;' + (rel ? 'paint-order:stroke;stroke:' + hi + ';stroke-width:4px;' : '') }, lab(97, i));
    });
    const min = MIN.map((label, i) => {
      const rel = i === 0 || i === 1 || i === 11;
      return Object.assign({ label, d: sector(48, 75, i), ps: 'fill:' + (rel ? 'url(#lcdhatch)' : 'transparent') + ';stroke:' + INK + ';stroke-width:1;stroke-opacity:0.7;', ts: 'fill:' + INK + ';font:20px VT323,monospace;text-anchor:middle;dominant-baseline:central;' + (rel ? 'paint-order:stroke;stroke:' + hi + ';stroke-width:4px;' : '') }, lab(61.5, i));
    });
    const tiles = [['Imaj7', 'Cmaj7'], ['ii7', 'Dm7'], ['iii7', 'Em7'], ['IVmaj7', 'Fmaj7'], ['V7', 'G7'], ['vi7', 'Am7'], ['viiø7', 'Bm7♭5'], ['7THS', 'ON']];
    const TW = 128;
    const strip = tiles.map(([num, name], i) => {
      const on = i === 4 || i === 7;
      return { num, name, style: 'width:' + TW + 'px;display:flex;align-items:center;justify-content:center;gap:6px;font:20px VT323,monospace;border:2px solid ' + INK + ';border-bottom:none;border-radius:6px 6px 0 0;' + (on ? 'background:' + INK + ';color:' + hi + ';text-shadow:none;' : 'color:' + INK + ';') };
    });
    const softkeys = tiles.map(() => ({ style: 'width:' + TW + 'px;height:20px;border-radius:3px;background:linear-gradient(180deg,#5a5a5d,#38383a);box-shadow:0 2px 0 #222,inset 0 1px 0 rgba(255,255,255,0.15);' }));
    const saved = [['C', 'I', 'C3G3C4E4'], ['Am', 'vi', 'A2E3A3C4'], ['F', 'IV', 'F2A3C4F4'], ['G7', 'V7', 'G2B3D4F4']];
    const slots = [];
    for (let i = 0; i < 8; i++) {
      const s = saved[i], last = i === 3;
      slots.push({ idx: (i + 1) + '', name: s ? s[0] : '--', num: s ? s[1] : '', notes: s ? s[2] : '', style: 'height:17px;display:flex;align-items:center;font-size:17px;padding:0 4px;' + (last ? 'background:' + INK + ';color:' + hi + ';text-shadow:none;' : (s ? '' : 'opacity:0.35;')) });
    }
    const ledOff = 'width:6px;height:6px;border-radius:50%;background:#7d786d;box-shadow:inset 0 1px 1px rgba(0,0,0,0.5);';
    const ledOn = (c) => 'width:6px;height:6px;border-radius:50%;background:' + c + ';box-shadow:0 0 6px ' + c + ';';
    const grey = 'width:96px;height:22px;border-radius:3px;background:linear-gradient(180deg,#5a5a5d,#3a3a3c);box-shadow:0 2px 0 #222,inset 0 1px 0 rgba(255,255,255,0.15);';
    const side = [
      { lab: 'PLAY', led: ledOff, key: grey }, { lab: 'LOOP', led: ledOn('#ffb238'), key: grey },
      { lab: 'REC', led: ledOff, key: 'width:96px;height:22px;border-radius:3px;background:linear-gradient(180deg,#c8423a,#9c2c26);box-shadow:0 2px 0 #5a1612,inset 0 1px 0 rgba(255,255,255,0.25);' },
      { lab: 'METRO', led: ledOn('#5ee36a'), key: grey },
      { lab: 'TAP', led: ledOff, key: grey }, { lab: 'MUTE OOK', led: ledOff, key: grey }
    ];
    return {
      lcdHi: hi, lcdLo: lo,
      notes: [{ note: 'B2', iv: '3' }, { note: 'F3', iv: '♭7' }, { note: 'G3', iv: 'R' }, { note: 'D4', iv: '5' }],
      whites, blacks, leds, maj, min, strip, softkeys, slots, side
    };
  }
}
</script>
</body>
</html>
