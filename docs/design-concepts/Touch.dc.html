<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scarlet and black touchscreen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111}
a{color:#fff}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 1400px; height: 620px; box-sizing: border-box; position: relative; overflow: hidden; background: #121213; font-family: Geist, sans-serif; color: #f2f2f2;">

<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 40px; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, rgba(0,0,0,0.05) 1px 2px, transparent 2px 4px), linear-gradient(90deg, #8e0d15, #c8212b 55%, #a51520); box-shadow: inset -2px 0 3px rgba(0,0,0,0.45);"></div>
<div style="position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, rgba(0,0,0,0.05) 1px 2px, transparent 2px 4px), linear-gradient(270deg, #8e0d15, #c8212b 55%, #a51520); box-shadow: inset 2px 0 3px rgba(0,0,0,0.45);"></div>

<div style="position: absolute; left: 40px; right: 40px; top: 0; height: 318px; background: radial-gradient(rgba(255,255,255,0.02) 0.6px, transparent 0.9px) 0 0 / 3px 3px, linear-gradient(180deg, #1d1d1f 0%, #131314 100%);">

<div style="position: absolute; left: 20px; right: 20px; top: 0; height: 30px; display: flex; align-items: center; gap: 14px; font-size: 12px; color: #8e8e92;">
<span style="font-weight: 800; color: #fff;">PMV 61</span>
<span style="width: 18px; height: 3px; background: #e3343c; border-radius: 2px;"></span>
<span>harmony</span>
<span style="color: #d6d6d8; margin-left: 6px;">view</span>
<div style="flex-grow: 1;"></div>
<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #fff;"></span>digital piano · asio</span>
<span style="margin-left: 12px; letter-spacing: 14px;">–□×</span>
</div>

<div style="position: absolute; left: 20px; top: 36px; width: 900px; height: 270px; box-sizing: border-box; padding: 5px; border-radius: 12px; background: #050505; box-shadow: 0 0 0 1px #2c2c2e, 0 1px 0 1px #3a3a3c;">
<div style="height: 260px; border-radius: 8px; background: #0e0f11; overflow: hidden; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: 26px minmax(0, 1fr) 40px; gap: 8px; padding: 8px; box-sizing: border-box;">

<div style="grid-column: span 12; display: flex; align-items: center; gap: 8px; font-size: 12px;">
<span style="background: #e3343c; color: #fff; padding: 3px 10px; border-radius: 12px; font-weight: 600;">Harmony</span>
<span style="color: #9a9aa0; padding: 3px 8px;">Song</span><span style="color: #9a9aa0; padding: 3px 8px;">Recorder</span><span style="color: #9a9aa0; padding: 3px 8px;">Settings</span>
<div style="flex-grow: 1;"></div>
<span style="font-family: 'Geist Mono', monospace; color: #c6c6ca;"><span style="color: #FFB000;">●</span> C major · ♩ 90 · 4/4</span>
</div>

<div style="grid-column: span 2; border-radius: 10px; background: #18191c; display: flex; align-items: center; justify-content: center;">
<svg width="104" height="130" viewBox="0 0 170 220" aria-hidden="true">
<g style="stroke: #4a4a50; stroke-width: 1.6;">
<line x1="6" y1="40" x2="166" y2="40"></line><line x1="6" y1="54" x2="166" y2="54"></line><line x1="6" y1="68" x2="166" y2="68"></line><line x1="6" y1="82" x2="166" y2="82"></line><line x1="6" y1="96" x2="166" y2="96"></line>
<line x1="6" y1="138" x2="166" y2="138"></line><line x1="6" y1="152" x2="166" y2="152"></line><line x1="6" y1="166" x2="166" y2="166"></line><line x1="6" y1="180" x2="166" y2="180"></line><line x1="6" y1="194" x2="166" y2="194"></line>
</g>
<text x="10" y="92" style="fill: #ddd; font: 60px 'Segoe UI Symbol', 'Apple Symbols', serif;">𝄞</text>
<text x="10" y="178" style="fill: #ddd; font: 46px 'Segoe UI Symbol', 'Apple Symbols', serif;">𝄢</text>
<g style="fill: #fff;"><circle cx="120" cy="103" r="7"></circle><circle cx="120" cy="173" r="7"></circle><circle cx="135" cy="166" r="7"></circle><circle cx="120" cy="187" r="7"></circle></g>
</svg>
</div>

<div style="grid-column: span 5; border-radius: 10px; background: linear-gradient(160deg, #1f1012 0%, #18191c 60%); box-shadow: inset 0 0 0 1px rgba(227,52,60,0.35); padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; gap: 8px;">
<div style="font-weight: 800; font-size: 88px; line-height: 0.88; letter-spacing: -3px;">G7/B</div>
<div style="display: flex; align-items: center; gap: 8px;"><span style="font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 16px; background: #fff; color: #000; padding: 0 7px; border-radius: 4px;">V65</span><span style="font-size: 14px; color: #a8a8ae;">1st inversion · drop 2</span></div>
<div style="display: flex; gap: 6px;">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<div style="{{n.style}}"><span style="font-size: 10px; color: #8a8a90;">{{n.iv}}</span><span style="font-size: 15px; font-weight: 600;">{{n.note}}</span></div>
</sc-for>
</div>
</div>

<div style="grid-column: span 2; border-radius: 10px; background: #18191c; display: flex; align-items: center; justify-content: center;">
<svg width="128" height="128" viewBox="0 0 260 260" aria-hidden="true">
<sc-for list="{{maj}}" as="s" hint-placeholder-count="12">
<path d="{{s.d}}" style="{{s.ps}}"></path>
<text x="{{s.lx}}" y="{{s.ly}}" style="{{s.ts}}">{{s.label}}</text>
</sc-for>
<path d="{{rootArc}}" style="fill: none; stroke: #4FA3FF; stroke-width: 6; stroke-linecap: round;"></path>
<text x="130" y="130" style="fill: #fff; font: 800 38px Geist, sans-serif; text-anchor: middle; dominant-baseline: central;">C</text>
</svg>
</div>

<div style="grid-column: span 3; border-radius: 10px; background: #18191c; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #8e8e92;"><span>Progression</span><span style="font-family: 'Geist Mono', monospace;">4/8</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px;">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
<div style="{{s.style}}"><span style="font-weight: 700;">{{s.name}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 10px; color: #8e8e92;">{{s.num}}</span></div>
</sc-for>
</div>
</div>

<div style="grid-column: span 12; display: flex; gap: 6px;">
<sc-for list="{{strip}}" as="t" hint-placeholder-count="8">
<div style="{{t.style}}"><span style="font-weight: 700;">{{t.num}}</span><span style="opacity: 0.7;">{{t.name}}</span></div>
</sc-for>
</div>
</div>
</div>

<div style="position: absolute; left: 942px; top: 40px; width: 356px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; justify-content: space-around;">
<sc-for list="{{knobs}}" as="k" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<div style="width: 86px; height: 86px; border-radius: 50%; background: #0b0b0c; box-shadow: inset 0 2px 4px #000, 0 1px 0 #2e2e30; display: flex; align-items: center; justify-content: center;">
<div style="{{k.cap}}"><div style="{{k.mark}}"></div></div>
</div>
<span style="font-size: 11px; color: #c6c6ca;">{{k.lab}}</span>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{transport}}" as="b" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
<div style="{{b.btn}}"><span style="{{b.icon}}"></span></div>
<span style="font-size: 10px; color: #9a9aa0;">{{b.lab}}</span>
</div>
</sc-for>
</div>
</div>
</div>

<div style="position: absolute; left: 40px; right: 40px; top: 318px; height: 4px; background: #e3343c; box-shadow: 0 0 10px rgba(227,52,60,0.5);"></div>
<div style="position: absolute; left: 40px; right: 40px; top: 322px; height: 6px; background: #0a0a0a;"></div>
<div style="position: absolute; left: 44px; top: 328px; width: 1312px; height: 284px; background: #0a0a0a;">
<sc-for list="{{whites}}" as="k" hint-placeholder-count="36">
<div style="{{k.style}}"><span style="{{k.ls}}">{{k.label}}</span></div>
</sc-for>
<sc-for list="{{blacks}}" as="k" hint-placeholder-count="25">
<div style="{{k.style}}"></div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1400,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const R = '#e3343c', A = '#FFB000';
    const WHITE = [0, 2, 4, 5, 7, 9, 11];
    const held = [47, 53, 55, 62];
    const W = 1312, H = 284, ww = W / 36, bw = ww * 0.57, bh = H * 0.61;
    const whites = [], blacks = [];
    let wi = 0;
    for (let m = 36; m <= 96; m++) {
      const pc = m % 12, oct = Math.floor(m / 12) - 1, h = held.includes(m);
      if (WHITE.includes(pc)) {
        const bg = h ? 'linear-gradient(180deg,#d5d0c6 0%,#e5e1d8 70%,#cfc9bd 100%)' : 'linear-gradient(180deg,#eae8e3 0%,#fbfaf8 14%,#f6f4f0 88%,#e1ddd6 100%)';
        whites.push({
          label: pc === 0 ? 'C' + oct : '',
          style: 'position:absolute;top:0;left:' + (wi * ww).toFixed(1) + 'px;width:' + (ww - 1).toFixed(1) + 'px;height:' + (h ? H - 4 : H) + 'px;background:' + bg + ';border-radius:0 0 4px 4px;box-shadow:' + (h ? 'inset 0 5px 6px rgba(0,0,0,0.3)' : 'inset 0 -6px 0 #dcd8d1,0 2px 2px rgba(0,0,0,0.5)') + ';',
          ls: 'position:absolute;left:0;right:0;bottom:14px;text-align:center;font:500 10px Geist,sans-serif;color:#a49f96;'
        });
        wi++;
      } else {
        const bg = h ? 'linear-gradient(180deg,#060606,#161616 90%,#232323)' : 'linear-gradient(180deg,#0d0d0d 0%,#272727 7%,#151515 82%,#343434 93%,#0f0f0f 100%)';
        blacks.push({ style: 'position:absolute;top:0;left:' + (wi * ww - bw / 2).toFixed(1) + 'px;width:' + bw.toFixed(1) + 'px;height:' + (h ? bh - 5 : bh).toFixed(0) + 'px;background:' + bg + ';border-radius:0 0 3px 3px;box-shadow:2px 4px 5px rgba(0,0,0,0.6);' });
      }
    }
    const C = 130;
    const pt = (r, a) => (C + r * Math.cos(a * Math.PI / 180)).toFixed(2) + ' ' + (C + r * Math.sin(a * Math.PI / 180)).toFixed(2);
    const arc = (r, i, g) => 'M ' + pt(r, -105 + i * 30 + g) + ' A ' + r + ' ' + r + ' 0 0 1 ' + pt(r, -75 + i * 30 - g);
    const lab = (r, i) => { const a = (-90 + i * 30) * Math.PI / 180; return { lx: (C + r * Math.cos(a)).toFixed(1), ly: (C + r * Math.sin(a)).toFixed(1) }; };
    const MAJ = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'D♭', 'A♭', 'E♭', 'B♭', 'F'];
    const maj = MAJ.map((label, i) => {
      const sel = i === 0, rel = i === 1 || i === 11;
      return Object.assign({ label, d: arc(98, i, 1.8), ps: 'fill:none;stroke:' + (sel ? A : (rel ? '#5c4510' : '#26272b')) + ';stroke-width:30;', ts: 'fill:' + (sel ? '#000' : (rel ? A : '#8a8a90')) + ';font:700 17px Geist,sans-serif;text-anchor:middle;dominant-baseline:central;' }, lab(98, i));
    });
    const notes = [['B2', '3'], ['F3', '♭7'], ['G3', 'R'], ['D4', '5']].map(([note, iv]) => ({ note, iv, style: 'width:46px;height:40px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Geist Mono",monospace;background:#0e0f11;' + (iv === 'R' ? 'box-shadow:inset 0 0 0 1.5px #fff;' : '') }));
    const saved = [['C', 'I'], ['Am', 'vi'], ['F', 'IV'], ['G7', 'V7']];
    const slots = [];
    for (let i = 0; i < 8; i++) {
      const s = saved[i];
      slots.push({ name: s ? s[0] : '', num: s ? s[1] : (i + 1) + '', style: 'height:30px;border-radius:7px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;font-size:13px;' + (s ? 'background:#232428;' + (i === 3 ? 'box-shadow:inset 0 0 0 1.5px ' + R + ';' : '') : 'border:1.5px dashed #2c2d31;') });
    }
    const tiles = [['I', 'Cmaj7'], ['ii', 'Dm7'], ['iii', 'Em7'], ['IV', 'Fmaj7'], ['V7', 'G7'], ['vi', 'Am7'], ['viiø', 'Bm7♭5'], ['7ths', 'on']];
    const strip = tiles.map(([num, name], i) => ({ num, name, style: 'flex:1;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;' + (i === 4 ? 'background:' + R + ';color:#fff;box-shadow:0 0 14px rgba(227,52,60,0.45);' : (i === 7 ? 'box-shadow:inset 0 0 0 1.5px #fff;color:#fff;' : 'background:#1d1e22;color:#a8a8ae;')) }));
    const cap = (bg) => 'width:66px;height:66px;border-radius:50%;background:' + bg + ';box-shadow:0 4px 7px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.3);position:relative;';
    const mark = (rot, c) => 'position:absolute;left:31px;top:6px;width:4px;height:14px;border-radius:2px;background:' + c + ';transform-origin:2px 27px;transform:rotate(' + rot + 'deg);';
    const knobs = [
      { lab: 'key', cap: cap('radial-gradient(circle at 40% 30%,#ff6a6f,' + R + ' 55%,#a2141c)'), mark: mark(0, '#fff') },
      { lab: 'tempo', cap: cap('radial-gradient(circle at 40% 30%,#4a4a4e,#1c1c1e 70%)'), mark: mark(-40, '#fff') },
      { lab: 'volume', cap: cap('radial-gradient(circle at 40% 30%,#4a4a4e,#1c1c1e 70%)'), mark: mark(50, '#fff') }
    ];
    const rb = 'width:52px;height:40px;border-radius:9px;background:linear-gradient(180deg,#2a2a2d,#1a1a1c);box-shadow:0 2px 0 #050505,inset 0 1px 0 rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;';
    const transport = [
      { lab: 'rec', icon: 'width:12px;height:12px;border-radius:50%;background:' + R + ';box-shadow:0 0 6px ' + R + ';' },
      { lab: 'play', icon: 'width:0;height:0;border-left:11px solid #eee;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px;' },
      { lab: 'loop', icon: 'width:14px;height:10px;border:2px solid #eee;border-radius:6px;' },
      { lab: 'save', icon: 'width:12px;height:12px;border-radius:2px;background:#fff;' },
      { lab: 'metro', icon: 'width:0;height:0;border-bottom:14px solid #fff;border-left:6px solid transparent;border-right:6px solid transparent;' },
      { lab: 'tap', icon: 'width:10px;height:10px;border-radius:50%;border:2px solid #eee;' },
      { lab: 'mute', icon: 'width:14px;height:2px;background:#eee;' },
      { lab: '7ths', icon: 'font:600 12px Geist,sans-serif;color:#fff;' }
    ].map((b) => Object.assign(b, { btn: rb }));
    return { whites, blacks, maj, notes, slots, strip, knobs, transport, rootArc: arc(124, 1, 3) };
  }
}
</script>
</body>
</html>
