<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scarlet gloss lacquer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#5a0610}
a{color:#e8cf95}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 1400px; height: 620px; box-sizing: border-box; position: relative; overflow: hidden; background: linear-gradient(180deg, #6e0812 0%, #b3142a 16%, #e2394c 21%, #c41d33 27%, #9c1022 60%, #7a0b19 100%); font-family: 'Instrument Sans', sans-serif; color: #f4e7c9;">
<div style="position: absolute; inset: 0; background: linear-gradient(105deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.08) 38%, rgba(255,255,255,0) 46%); pointer-events: none;"></div>

<div style="position: absolute; left: 24px; right: 24px; top: 0; height: 32px; display: flex; align-items: center; gap: 14px; font-size: 12px; letter-spacing: 1px; color: rgba(244,231,201,0.8);">
<span style="font-weight: 600; font-size: 14px; letter-spacing: 3px; color: #e8cf95;">PMV · 61</span>
<span>concert harmony</span>
<span style="color: #f4e7c9; margin-left: 6px;">view</span>
<div style="flex-grow: 1;"></div>
<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #f4e7c9; box-shadow: 0 0 6px #f4e7c9;"></span>digital piano · asio</span>
<span style="margin-left: 12px; letter-spacing: 14px;">–□×</span>
</div>

<div style="position: absolute; left: 24px; top: 48px; width: 200px; display: flex; flex-direction: column; gap: 12px; align-items: center;">
<sc-for list="{{knobs}}" as="k" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; width: 190px;">
<div style="width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(from 30deg, #f2dc9e, #a07a32, #f7e6b4, #8f6a28, #f2dc9e, #a8823a, #f5e2ab, #8f6a28, #f2dc9e); box-shadow: 0 5px 9px rgba(40,0,6,0.55), 0 0 0 4px rgba(40,0,6,0.35); position: relative;"><div style="{{k.mark}}"></div></div>
<div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 600; letter-spacing: 1.5px;">{{k.lab}}</span><span style="font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(244,231,201,0.75);">{{k.val}}</span></div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 244px; top: 40px; width: 912px; height: 216px; box-sizing: border-box; padding: 4px; border-radius: 10px; background: linear-gradient(180deg, #f2dc9e, #a07a32 50%, #e8cf95); box-shadow: 0 6px 14px rgba(40,0,6,0.45);">
<div style="position: relative; height: 208px; border-radius: 7px; overflow: hidden; background: #050404; display: flex; flex-direction: column; padding: 12px 20px; box-sizing: border-box; color: #f4e7c9;">
<div style="position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0.08), rgba(255,255,255,0) 28%); pointer-events: none;"></div>
<div style="display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 11px; color: rgba(244,231,201,0.6); letter-spacing: 0.5px;">
<span>C major · no sharps or flats</span><span>♩ 90 · 4/4 · progression 4 of 8</span>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; gap: 26px;">
<svg width="100" height="124" viewBox="0 0 170 220" aria-hidden="true">
<g style="stroke: rgba(244,231,201,0.35); stroke-width: 1.4;">
<line x1="6" y1="40" x2="166" y2="40"></line><line x1="6" y1="54" x2="166" y2="54"></line><line x1="6" y1="68" x2="166" y2="68"></line><line x1="6" y1="82" x2="166" y2="82"></line><line x1="6" y1="96" x2="166" y2="96"></line>
<line x1="6" y1="138" x2="166" y2="138"></line><line x1="6" y1="152" x2="166" y2="152"></line><line x1="6" y1="166" x2="166" y2="166"></line><line x1="6" y1="180" x2="166" y2="180"></line><line x1="6" y1="194" x2="166" y2="194"></line>
</g>
<text x="10" y="92" style="fill: #e8cf95; font: 60px 'Segoe UI Symbol', 'Apple Symbols', serif;">𝄞</text>
<text x="10" y="178" style="fill: #e8cf95; font: 46px 'Segoe UI Symbol', 'Apple Symbols', serif;">𝄢</text>
<g style="fill: #f4e7c9;"><ellipse cx="120" cy="103" rx="8" ry="5.8" transform="rotate(-20 120 103)"></ellipse><ellipse cx="120" cy="173" rx="8" ry="5.8" transform="rotate(-20 120 173)"></ellipse><ellipse cx="136" cy="166" rx="8" ry="5.8" transform="rotate(-20 136 166)"></ellipse><ellipse cx="120" cy="187" rx="8" ry="5.8" transform="rotate(-20 120 187)"></ellipse></g>
</svg>
<div style="display: flex; flex-direction: column; gap: 6px;">
<div style="font-weight: 500; font-size: 100px; line-height: 0.9; letter-spacing: -3px;">G7/B</div>
<div style="font-size: 16px; color: rgba(244,231,201,0.75);"><span style="color: #e8cf95; font-weight: 600;">V65</span> · first inversion · drop 2</div>
</div>
<div style="display: flex; gap: 16px; font-family: 'DM Mono', monospace; padding-left: 20px; border-left: 1px solid rgba(232,207,149,0.35);">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px;"><span style="font-size: 22px; font-weight: 500;">{{n.note}}</span><span style="font-size: 12px; color: rgba(244,231,201,0.55);">{{n.iv}}</span></div>
</sc-for>
</div>
<div style="flex-grow: 1;"></div>
<svg width="136" height="136" viewBox="0 0 240 240" aria-hidden="true">
<sc-for list="{{maj}}" as="s" hint-placeholder-count="12">
<path d="{{s.d}}" style="{{s.ps}}"></path>
<text x="{{s.lx}}" y="{{s.ly}}" style="{{s.ts}}">{{s.label}}</text>
</sc-for>
<circle cx="120" cy="120" r="58" style="fill: none; stroke: rgba(232,207,149,0.35); stroke-width: 1;"></circle>
<text x="120" y="120" style="fill: #e8cf95; font: 500 36px 'Instrument Sans', sans-serif; text-anchor: middle; dominant-baseline: central;">C</text>
</svg>
</div>
<div style="display: flex; gap: 8px; font-size: 13px;">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
<div style="{{s.style}}"><span style="font-weight: 600;">{{s.name}}</span><span style="font-family: 'DM Mono', monospace; font-size: 10px; opacity: 0.6;">{{s.num}}</span></div>
</sc-for>
</div>
</div>
</div>

<div style="position: absolute; left: 244px; top: 266px; width: 912px; display: flex; justify-content: space-between;">
<sc-for list="{{strip}}" as="t" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 8px;">
<div style="{{t.btn}}"></div>
<div style="display: flex; flex-direction: column; line-height: 1.05;"><span style="font-size: 13px; font-weight: 600;">{{t.num}}</span><span style="font-size: 10px; color: rgba(244,231,201,0.7);">{{t.name}}</span></div>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 1176px; top: 48px; width: 200px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 8px; justify-items: center;">
<sc-for list="{{btns}}" as="b" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
<div style="{{b.btn}}"><span style="{{b.icon}}"></span></div>
<span style="font-size: 10px; letter-spacing: 0.5px; color: rgba(244,231,201,0.85);">{{b.lab}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; top: 308px; height: 2px; background: linear-gradient(90deg, rgba(232,207,149,0), #e8cf95 20%, #e8cf95 80%, rgba(232,207,149,0));"></div>
<div style="position: absolute; left: 20px; top: 312px; width: 1360px; height: 8px; background: linear-gradient(180deg, #5a0610, #3a0309);"></div>
<div style="position: absolute; left: 20px; top: 320px; width: 1360px; height: 292px; background: #120203;">
<sc-for list="{{whites}}" as="k" hint-placeholder-count="36">
<div style="{{k.style}}"><span style="{{k.ls}}">{{k.label}}</span></div>
</sc-for>
<sc-for list="{{blacks}}" as="k" hint-placeholder-count="25">
<div style="{{k.style}}"></div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1400,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const GOLD = '#e8cf95', CH = '#f4e7c9';
    const WHITE = [0, 2, 4, 5, 7, 9, 11];
    const held = [47, 53, 55, 62];
    const W = 1360, H = 292, ww = W / 36, bw = ww * 0.56, bh = H * 0.6;
    const whites = [], blacks = [];
    let wi = 0;
    for (let m = 36; m <= 96; m++) {
      const pc = m % 12, oct = Math.floor(m / 12) - 1, h = held.includes(m);
      if (WHITE.includes(pc)) {
        const bg = h ? 'linear-gradient(180deg,#d8cdb5 0%,#e6dcc6 70%,#cfc3a9 100%)' : 'linear-gradient(180deg,#ece3cf 0%,#fbf6ea 14%,#f6efde 88%,#e2d8c2 100%)';
        whites.push({
          label: pc === 0 ? 'C' + oct : '',
          style: 'position:absolute;top:0;left:' + (wi * ww).toFixed(1) + 'px;width:' + (ww - 1).toFixed(1) + 'px;height:' + (h ? H - 4 : H) + 'px;background:' + bg + ';border-radius:0 0 4px 4px;box-shadow:' + (h ? 'inset 0 5px 6px rgba(0,0,0,0.3)' : 'inset 0 -6px 0 #dcd1b9,0 2px 2px rgba(0,0,0,0.5)') + ';',
          ls: 'position:absolute;left:0;right:0;bottom:14px;text-align:center;font:500 10px "Instrument Sans",sans-serif;color:#a89a7c;'
        });
        wi++;
      } else {
        const bg = h ? 'linear-gradient(180deg,#060404,#171313 90%,#241e1e)' : 'linear-gradient(180deg,#0e0b0b 0%,#2a2424 7%,#161212 82%,#383030 93%,#100c0c 100%)';
        blacks.push({ style: 'position:absolute;top:0;left:' + (wi * ww - bw / 2).toFixed(1) + 'px;width:' + bw.toFixed(1) + 'px;height:' + (h ? bh - 5 : bh).toFixed(0) + 'px;background:' + bg + ';border-radius:0 0 3px 3px;box-shadow:2px 4px 5px rgba(0,0,0,0.6);' });
      }
    }
    const pt = (r, a) => (120 + r * Math.cos(a * Math.PI / 180)).toFixed(2) + ' ' + (120 + r * Math.sin(a * Math.PI / 180)).toFixed(2);
    const sector = (r1, r2, i) => { const a0 = -105 + i * 30 + 1, a1 = -75 + i * 30 - 1; return 'M ' + pt(r2, a0) + ' A ' + r2 + ' ' + r2 + ' 0 0 1 ' + pt(r2, a1) + ' L ' + pt(r1, a1) + ' A ' + r1 + ' ' + r1 + ' 0 0 0 ' + pt(r1, a0) + ' Z'; };
    const lab = (r, i) => { const a = (-90 + i * 30) * Math.PI / 180; return { lx: (120 + r * Math.cos(a)).toFixed(1), ly: (120 + r * Math.sin(a)).toFixed(1) }; };
    const MAJ = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'D♭', 'A♭', 'E♭', 'B♭', 'F'];
    const maj = MAJ.map((label, i) => {
      const sel = i === 0, rel = i === 1 || i === 11, root = i === 1;
      return Object.assign({ label, d: sector(66, 116, i), ps: 'fill:' + (sel ? GOLD : (rel ? 'rgba(232,207,149,0.16)' : 'transparent')) + ';stroke:' + (root ? '#fff' : 'rgba(232,207,149,0.4)') + ';stroke-width:' + (root ? 3.5 : 1) + ';', ts: 'fill:' + (sel ? '#120203' : (rel ? GOLD : 'rgba(244,231,201,0.7)')) + ';font:500 19px "Instrument Sans",sans-serif;text-anchor:middle;dominant-baseline:central;' }, lab(91, i));
    });
    const saved = [['C', 'I'], ['Am', 'vi'], ['F', 'IV'], ['G7', 'V7']];
    const slots = [];
    for (let i = 0; i < 8; i++) {
      const s = saved[i];
      slots.push({ name: s ? s[0] : '', num: s ? s[1] : (i + 1) + '', style: 'flex:1;height:26px;border-radius:13px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;' + (s ? (i === 3 ? 'background:' + GOLD + ';color:#120203;' : 'box-shadow:inset 0 0 0 1px rgba(232,207,149,0.55);') : 'box-shadow:inset 0 0 0 1px rgba(232,207,149,0.18);color:rgba(244,231,201,0.4);') });
    }
    const mark = (rot) => 'position:absolute;left:30px;top:6px;width:4px;height:12px;border-radius:2px;background:#5a0610;transform-origin:2px 26px;transform:rotate(' + rot + 'deg);';
    const knobs = [{ lab: 'VOLUME', val: '−6 dB', mark: mark(40) }, { lab: 'TEMPO', val: '90 bpm', mark: mark(-30) }, { lab: 'CLICK', val: '60%', mark: mark(10) }];
    const touch = (lit) => 'width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a1a1a,#0b0606 70%);box-shadow:0 0 0 2px ' + GOLD + ',0 3px 6px rgba(40,0,6,0.5)' + (lit ? ',0 0 12px rgba(244,231,201,0.7),inset 0 0 8px rgba(244,231,201,0.6)' : '') + ';display:flex;align-items:center;justify-content:center;';
    const tiles = [['I', 'Cmaj7'], ['ii', 'Dm7'], ['iii', 'Em7'], ['IV', 'Fmaj7'], ['V7', 'G7'], ['vi', 'Am7'], ['viiø', 'Bm7♭5'], ['7ths', 'on']];
    const strip = tiles.map(([num, name], i) => ({ num, name, btn: touch(i === 4 || i === 7) }));
    const icon = (s) => s;
    const btns = [
      ['record', 'width:10px;height:10px;border-radius:50%;background:#ff5a5a;'],
      ['play', 'width:0;height:0;border-left:10px solid ' + CH + ';border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px;'],
      ['loop', 'width:12px;height:8px;border:1.5px solid ' + CH + ';border-radius:5px;'],
      ['key ◂', 'width:6px;height:6px;border-radius:50%;background:' + GOLD + ';'],
      ['key ▸', 'width:6px;height:6px;border-radius:50%;background:' + GOLD + ';'],
      ['metronome', 'width:6px;height:6px;border-radius:50%;background:' + CH + ';box-shadow:0 0 6px ' + CH + ';'],
      ['tap', 'width:6px;height:6px;border-radius:50%;background:rgba(244,231,201,0.3);'],
      ['mute', 'width:6px;height:6px;border-radius:50%;background:rgba(244,231,201,0.3);'],
      ['save', 'width:10px;height:10px;border-radius:2px;background:' + GOLD + ';']
    ].map(([lab, ic]) => ({ lab, icon: icon(ic), btn: 'width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a1a1a,#0b0606 70%);box-shadow:0 0 0 2px ' + GOLD + ',0 3px 6px rgba(40,0,6,0.5);display:flex;align-items:center;justify-content:center;' }));
    return {
      notes: [{ note: 'B2', iv: '3' }, { note: 'F3', iv: '♭7' }, { note: 'G3', iv: 'R' }, { note: 'D4', iv: '5' }],
      whites, blacks, maj, slots, knobs, strip, btns
    };
  }
}
</script>
</body>
</html>
