<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colour OLED synth</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1b1c1e}
a{color:#bbb}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 1400px; height: 620px; box-sizing: border-box; position: relative; overflow: hidden; background: #202124; font-family: 'Inter Tight', sans-serif; color: #e8e8e6;">

<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 36px; background: repeating-linear-gradient(89deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 5px, rgba(255,230,190,0.06) 5px 6px, transparent 6px 10px), linear-gradient(90deg, #5a3a22 0%, #8a5a36 50%, #6a442a 100%); box-shadow: inset -2px 0 3px rgba(0,0,0,0.5);"></div>
<div style="position: absolute; right: 0; top: 0; bottom: 0; width: 36px; background: repeating-linear-gradient(91deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 5px, rgba(255,230,190,0.06) 5px 6px, transparent 6px 10px), linear-gradient(270deg, #5a3a22 0%, #8a5a36 50%, #6a442a 100%); box-shadow: inset 2px 0 3px rgba(0,0,0,0.5);"></div>

<div style="position: absolute; left: 36px; right: 36px; top: 0; height: 334px; background: radial-gradient(rgba(255,255,255,0.025) 0.6px, transparent 0.9px) 0 0 / 3px 3px, linear-gradient(180deg, #2c2d31 0%, #222326 100%);">

<div style="position: absolute; left: 20px; right: 20px; top: 0; height: 28px; display: flex; align-items: center; gap: 14px; font-size: 12px; color: #8d8e92;">
<span style="font-weight: 800; color: #f2f2f0; letter-spacing: 0.5px;">PMV—61</span>
<span>harmony synth</span>
<span style="color: #c4c5c8; margin-left: 6px;">view</span>
<div style="flex-grow: 1;"></div>
<span style="display: flex; align-items: center; gap: 6px;"><span style="width: 6px; height: 6px; border-radius: 50%; background: #3dd68c; box-shadow: 0 0 5px #3dd68c;"></span>digital piano · asio</span>
<span style="margin-left: 12px; letter-spacing: 14px;">–□×</span>
</div>

<div style="position: absolute; left: 20px; top: 40px; width: 240px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #8d8e92;"><span>progression pads</span><span style="font-family: 'JetBrains Mono', monospace;">4/8</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{pads}}" as="p" hint-placeholder-count="8">
<div style="{{p.style}}"><span>{{p.name}}</span><span style="font-size: 10px; opacity: 0.75;">{{p.num}}</span></div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px;">
<sc-for list="{{transport}}" as="b" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
<div style="{{b.btn}}"><span style="{{b.icon}}"></span></div>
<span style="font-size: 10px; color: #8d8e92;">{{b.lab}}</span>
</div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 280px; top: 40px; width: 560px; height: 236px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: #111214; box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), 0 1px 0 #3a3b3f;">
<div style="height: 224px; border-radius: 6px; background: #000; overflow: hidden; display: flex; flex-direction: column; padding: 10px 14px; box-sizing: border-box; gap: 6px;">
<div style="display: flex; gap: 6px; font-size: 11px;">
<span style="background: #FFB000; color: #000; padding: 1px 8px; border-radius: 8px; font-weight: 700;">C major</span>
<span style="color: #9a9a9a; padding: 1px 4px;">♩ 90</span>
<span style="color: #9a9a9a; padding: 1px 4px;">4/4</span>
<div style="flex-grow: 1;"></div>
<span style="color: #9a9a9a;">harmony</span>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; gap: 12px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
<div style="font-weight: 800; font-size: 86px; line-height: 0.9; letter-spacing: -3px;">G7/B</div>
<div style="display: flex; align-items: center; gap: 8px;"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 17px; background: #fff; color: #000; padding: 0 7px; border-radius: 4px;">V65</span><span style="font-size: 15px; color: #a8a8a8;">1st inversion · drop 2</span></div>
<div style="display: flex; gap: 6px;">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<div style="{{n.style}}"><span style="font-size: 10px; color: #8fc2ff;">{{n.iv}}</span><span style="font-size: 16px; font-weight: 700;">{{n.note}}</span></div>
</sc-for>
</div>
</div>
<svg width="168" height="168" viewBox="0 0 260 260" aria-hidden="true">
<sc-for list="{{maj}}" as="s" hint-placeholder-count="12">
<path d="{{s.d}}" style="{{s.ps}}"></path>
<text x="{{s.lx}}" y="{{s.ly}}" style="{{s.ts}}">{{s.label}}</text>
</sc-for>
<sc-for list="{{min}}" as="s" hint-placeholder-count="12">
<path d="{{s.d}}" style="{{s.ps}}"></path>
</sc-for>
<path d="{{rootArc}}" style="fill: none; stroke: #4FA3FF; stroke-width: 6; stroke-linecap: round;"></path>
<text x="130" y="130" style="fill: #fff; font: 800 34px 'Inter Tight', sans-serif; text-anchor: middle; dominant-baseline: central;">C</text>
</svg>
</div>
</div>
</div>

<div style="position: absolute; left: 862px; top: 40px; width: 444px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; justify-items: center;">
<sc-for list="{{encoders}}" as="e" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
<div style="position: relative; width: 84px; height: 84px;">
<sc-for list="{{e.dots}}" as="d" hint-placeholder-count="13">
<span style="{{d.style}}"></span>
</sc-for>
<div style="position: absolute; left: 17px; top: 17px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #4a4b50, #18191b 72%); box-shadow: 0 3px 5px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.14);"><div style="{{e.mark}}"></div></div>
</div>
<span style="font-size: 11px; color: #c4c5c8;">{{e.lab}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8d8e92;">{{e.val}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 280px; top: 290px; width: 560px; display: flex; gap: 6px;">
<sc-for list="{{strip}}" as="t" hint-placeholder-count="8">
<div style="{{t.style}}"><span style="{{t.led}}"></span><span style="font-weight: 700;">{{t.num}}</span></div>
</sc-for>
</div>
<div style="position: absolute; left: 862px; top: 296px; font-size: 11px; color: #8d8e92;">chords in key · tap to hear, hold to hint</div>
</div>

<div style="position: absolute; left: 36px; right: 36px; top: 334px; height: 6px; background: linear-gradient(180deg, #5e1b1f, #3d1013);"></div>
<div style="position: absolute; left: 40px; top: 340px; width: 1320px; height: 272px; background: #0d0d0d;">
<sc-for list="{{whites}}" as="k" hint-placeholder-count="36">
<div style="{{k.style}}"><span style="{{k.ls}}">{{k.label}}</span></div>
</sc-for>
<sc-for list="{{blacks}}" as="k" hint-placeholder-count="25">
<div style="{{k.style}}"></div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1400,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const A = '#FFB000', B = '#4FA3FF';
    const WHITE = [0, 2, 4, 5, 7, 9, 11];
    const held = [47, 53, 55, 62];
    const W = 1320, H = 272, ww = W / 36, bw = ww * 0.57, bh = H * 0.61;
    const whites = [], blacks = [];
    let wi = 0;
    for (let m = 36; m <= 96; m++) {
      const pc = m % 12, oct = Math.floor(m / 12) - 1, h = held.includes(m);
      if (WHITE.includes(pc)) {
        const bg = h ? 'linear-gradient(180deg,#d5cfc2 0%,#e5e0d5 70%,#cfc8ba 100%)' : 'linear-gradient(180deg,#e9e5dd 0%,#faf8f3 14%,#f5f2eb 88%,#e0dcd2 100%)';
        whites.push({
          label: pc === 0 ? 'C' + oct : '',
          style: 'position:absolute;top:0;left:' + (wi * ww).toFixed(1) + 'px;width:' + (ww - 1).toFixed(1) + 'px;height:' + (h ? H - 4 : H) + 'px;background:' + bg + ';border-radius:0 0 4px 4px;box-shadow:' + (h ? 'inset 0 5px 6px rgba(0,0,0,0.3)' : 'inset 0 -6px 0 #dbd7cd,0 2px 2px rgba(0,0,0,0.5)') + ';',
          ls: 'position:absolute;left:0;right:0;bottom:14px;text-align:center;font:500 10px "Inter Tight",sans-serif;color:#a29d92;'
        });
        wi++;
      } else {
        const bg = h ? 'linear-gradient(180deg,#060606,#161616 90%,#232323)' : 'linear-gradient(180deg,#0d0d0d 0%,#272727 7%,#151515 82%,#343434 93%,#0f0f0f 100%)';
        blacks.push({ style: 'position:absolute;top:0;left:' + (wi * ww - bw / 2).toFixed(1) + 'px;width:' + bw.toFixed(1) + 'px;height:' + (h ? bh - 5 : bh).toFixed(0) + 'px;background:' + bg + ';border-radius:0 0 3px 3px;box-shadow:2px 4px 5px rgba(0,0,0,0.6);' });
      }
    }
    const C = 130;
    const pt = (r, a) => (C + r * Math.cos(a * Math.PI / 180)).toFixed(2) + ' ' + (C + r * Math.sin(a * Math.PI / 180)).toFixed(2);
    const arc = (r, i, g) => 'M ' + pt(r, -105 + i * 30 + g) + ' A ' + r + ' ' + r + ' 0 0 1 ' + pt(r, -75 + i * 30 - g);
    const lab = (r, i) => { const a = (-90 + i * 30) * Math.PI / 180; return { lx: (C + r * Math.cos(a)).toFixed(1), ly: (C + r * Math.sin(a)).toFixed(1) }; };
    const MAJ = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'D♭', 'A♭', 'E♭', 'B♭', 'F'];
    const maj = MAJ.map((label, i) => {
      const sel = i === 0, rel = i === 1 || i === 11;
      return Object.assign({ label, d: arc(100, i, 1.6), ps: 'fill:none;stroke:' + (sel ? A : (rel ? '#5c4510' : '#232323')) + ';stroke-width:28;', ts: 'fill:' + (sel ? '#000' : (rel ? A : '#9a9a9a')) + ';font:700 16px "Inter Tight",sans-serif;text-anchor:middle;dominant-baseline:central;' }, lab(100, i));
    });
    const min = MAJ.map((_, i) => ({ d: arc(68, i, 2.2), ps: 'fill:none;stroke:' + ((i === 0 || i === 1 || i === 11) ? '#3a2c0a' : '#151515') + ';stroke-width:24;' }));
    const notes = [['B2', '3'], ['F3', '♭7'], ['G3', 'R'], ['D4', '5']].map(([note, iv]) => ({ note, iv, style: 'width:44px;height:40px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"JetBrains Mono",monospace;background:#0e1a2a;box-shadow:inset 0 0 0 1.5px ' + (iv === 'R' ? '#fff' : B) + ';' }));
    const saved = [['C', 'I', '#e9b44c'], ['Am', 'vi', '#5bc0a8'], ['F', 'IV', '#b39ddb'], ['G7', 'V7', '#ffffff']];
    const pads = [];
    for (let i = 0; i < 8; i++) {
      const s = saved[i];
      pads.push({ name: s ? s[0] : '', num: s ? s[1] : '', style: 'height:52px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;' + (s ? 'background:radial-gradient(circle at 50% 40%,' + s[2] + ',' + s[2] + 'aa 70%);color:#141414;box-shadow:0 0 14px ' + s[2] + '66,inset 0 -3px 0 rgba(0,0,0,0.2);' + (i === 3 ? 'outline:2px solid #fff;outline-offset:2px;' : '') : 'background:linear-gradient(180deg,#38393d,#2b2c30);box-shadow:inset 0 -3px 0 rgba(0,0,0,0.3);') });
    }
    const roundBtn = (bg) => 'width:40px;height:40px;border-radius:50%;background:' + bg + ';box-shadow:0 2px 0 #0d0d0e,inset 0 1px 0 rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;';
    const transport = [
      { lab: 'rec', btn: roundBtn('linear-gradient(180deg,#38393d,#26272a)'), icon: 'width:12px;height:12px;border-radius:50%;background:#ff4b3e;' },
      { lab: 'play', btn: roundBtn('linear-gradient(180deg,#38393d,#26272a)'), icon: 'width:0;height:0;border-left:11px solid #eee;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px;' },
      { lab: 'loop', btn: roundBtn('linear-gradient(180deg,#38393d,#26272a)'), icon: 'width:14px;height:10px;border:2px solid ' + A + ';border-radius:6px;' },
      { lab: 'save', btn: roundBtn('linear-gradient(180deg,#f4f4f2,#d6d6d3)'), icon: 'width:12px;height:12px;border-radius:2px;background:#222;' }
    ];
    const ring = (val, col) => {
      const dots = [];
      for (let i = 0; i < 13; i++) {
        const a = (-225 + i * (270 / 12)) * Math.PI / 180, on = i <= val;
        const x = 42 + 38 * Math.cos(a) - 2.5, y = 42 + 38 * Math.sin(a) - 2.5;
        dots.push({ style: 'position:absolute;left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;width:5px;height:5px;border-radius:50%;' + (on ? 'background:' + col + ';box-shadow:0 0 5px ' + col + ';' : 'background:#3a3b3f;') });
      }
      return dots;
    };
    const mark = (val) => 'position:absolute;left:24px;top:4px;width:2px;height:12px;border-radius:1px;background:#eee;transform-origin:1px 21px;transform:rotate(' + (-135 + val * 22.5) + 'deg);';
    const enc = (lab, v, val, col) => ({ lab, val: v, dots: ring(val, col), mark: mark(val) });
    const encoders = [
      enc('key', 'C', 0, A), enc('scale', 'major', 2, '#fff'), enc('tempo', '90', 4, '#fff'), enc('meter', '4/4', 3, '#fff'),
      enc('speed', '100%', 12, '#fff'), enc('volume', '-6 dB', 9, '#fff'), enc('click', '60%', 7, '#fff'), enc('transpose', '0', 6, '#fff')
    ];
    const tiles = ['I', 'ii', 'iii', 'IV', 'V7', 'vi', 'viiø', '7ths'];
    const strip = tiles.map((num, i) => ({ num, led: 'width:16px;height:3px;border-radius:2px;' + (i === 4 ? 'background:' + B + ';box-shadow:0 0 6px ' + B + ';' : (i === 7 ? 'background:#fff;box-shadow:0 0 5px #fff;' : 'background:#3a3b3f;')), style: 'flex:1;height:34px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;background:linear-gradient(180deg,#38393d,#2b2c30);box-shadow:0 2px 0 #0d0d0e,inset 0 1px 0 rgba(255,255,255,0.1);' }));
    return { whites, blacks, maj, min, notes, pads, transport, encoders, strip, rootArc: arc(122, 1, 3) };
  }
}
</script>
</body>
</html>
